name: Publish to npm

# Run by hand: Actions > Publish to npm > Run workflow. It stages the version in package.json on npm,
# after the same checks as the tests; nothing goes live until you approve it on npmjs.com (Staged
# Packages), with your two-factor code. It signs in with npm's trusted publishing, so it needs no
# token: the package's settings on npmjs.com name this workflow as its Trusted Publisher. npm
# records that the package was built here (provenance).
#
# npm expires a newly added Trusted Publisher if it isn't used within 2 days, so add it just before
# the first run that uses it (see the README). Version 0.1.0 was staged with a token, since deleted.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Stage on npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15 or later; Node 22 comes with npm 10.
      - name: Update npm
        run: npm install -g npm@11 && npm --version

      - name: The versions match, and this one isn't on npm yet
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          manifest=$(node -p "require('./snap.manifest.json').version")
          if [ "$version" != "$manifest" ]; then
            echo "::error::package.json says $version but snap.manifest.json says $manifest."
            exit 1
          fi
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "::error::$name $version is already on npm: raise the version in both files first."
            exit 1
          fi
          echo "Staging $name $version"

      - run: npm ci

      - name: Type check and build
        run: npm run typecheck && npm run build

      - name: The committed manifest matches the build
        run: git diff --exit-code snap.manifest.json

      - name: Tests, including lookups of real names on PulseChain and Ethereum
        run: npm run test:live

      # Trusted publishing: npm trades this run's GitHub identity (id-token: write) for a one-off
      # sign-in.
      - name: Stage it on npm
        run: npm stage publish --provenance --access public

      - name: Next
        run: |
          echo "::notice::Staged. To publish it, open npmjs.com, then Staged Packages, check it and click Approve (you'll be asked for your two-factor code)."
