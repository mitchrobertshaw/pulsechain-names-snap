name: Publish to npm

# Run by hand: Actions > Publish to npm > Run workflow. It stages the version in package.json on npm,
# after the same checks as the tests; nothing goes live until you approve it on npmjs.com (Staged
# Packages), with your two-factor code. Sign-in is either the NPM_TOKEN repository secret (a
# "Read and write (stage only)" token) or, once the package exists, npm's trusted publishing for
# this workflow, which needs no token. npm records that the package was built here (provenance).

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Stage on npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15 or later; Node 22 comes with npm 10.
      - name: Update npm
        run: npm install -g npm@11 && npm --version

      - name: The versions match, and this one isn't on npm yet
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          manifest=$(node -p "require('./snap.manifest.json').version")
          if [ "$version" != "$manifest" ]; then
            echo "::error::package.json says $version but snap.manifest.json says $manifest."
            exit 1
          fi
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "::error::$name $version is already on npm: raise the version in both files first."
            exit 1
          fi
          echo "Staging $name $version"

      - run: npm ci

      - name: Type check and build
        run: npm run typecheck && npm run build

      - name: The committed manifest matches the build
        run: git diff --exit-code snap.manifest.json

      - name: Tests, including lookups of real names on PulseChain and Ethereum
        run: npm run test:live

      - name: Stage it on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage publish --provenance --access public

      - name: Next
        run: |
          echo "::notice::Staged. To publish it, open npmjs.com, then Staged Packages, check it and click Approve (you'll be asked for your two-factor code)."
